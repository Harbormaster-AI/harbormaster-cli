#
# Standard DevOps project creation options.  
#
# Pay close attention to parameters that require values unique  
# to you, such as those for Git, Docker, and AWS.
#
# To use Git, Docker, and any provider, be sure to have created
# an account with each.  
#
# For Git, before generating the project be sure to create the 
# repository and designate as public.
#

project:
    name: Golang Demo
    description: Sample Golang project
    techstack:
        name:             Golang
                          # To see the list of available tech stacks on a Harbormaster instance use command:
                          #     harbormaster_cli stack_list --output pretty

    model:
        name:             bowling-league
                          # options:     Unique name of an existing model, a URL to a model file or Git repo, 
                          #                or full/relative path to a model file.
                          #
                          # To see the list of supported model types use command:
                          #      harbormaster_cli model_types_supported
                          #                          
                          # To see the list of available models on a Harbormaster instance use command:
                          #      harbormaster_cli model_list --output pretty
                          # 
                          # For JAR files and Git Repos with Java Files, include the root package names of the root package
#        javaRootPackageNames:
#          - com.freeport.bo    
#        primaryKeyPattern: _pojoName_Id # the pattern to look for when interrogating a POJO for a primary key field
                              # allowed values are a either a literal, ex: id OR 
                              # POJOName with a suffix, ex: _pojoName_Id will handle accountId, customerId, etc...                 

    # ------------------------------------------------------------
    # Git repository parameters
    # - password is a Git token.  This data is never stored
    # - anonymous users provide a Git token.
    # - logged in User's from a Harbormaster Server instance
    # do need to provide this
    # ------------------------------------------------------------

    git:
        inUse:          true
        name:           git_test_go        # arbitrary name
        host:           # git host name - defaults to github.cmo
        owner:          # owner name
        repository:     # repo name
        password:       # replace with a GitHub token with the right level of access


    # ------------------------------------------------------------
    # Docker parameters
    # ------------------------------------------------------------

    docker:
        inUse:        true
        name:         docker_test_go   # arbitrary name
        username:     # username for docker
        password:     # password for docker - HM never stores it
        orgName:      # organization name
        repository:
        tag:          latest
        host:         docker.io

    # ------------------------------------------------------------
    # Terraform properties
    # ------------------------------------------------------------
    terraform:
        inUse:             true
        dbUsername:         # leave blank, terraform will handle credential exchange to the remote resources
        dbPassword:         # leave blank, terraform will handle credential exchange to the remote resources
        dbEngine:          mysql   # options - mysql, mongo, postgres
        dbVersion:         # leave blank to apply vendor default
        dbPort:            3306     # if blank, HM will assign the dbEngine vendor default
        provider:           aws

    # ------------------------------------------------------------
    # AWS properties
    # ------------------------------------------------------------
    aws:
        accessKey:          # see AWS IAM
        secretKey:          # see AWS IAM
        vpc:                # leave blank, terraform will assign
        region:             us-east-2
        ec2InstanceType:    t2.medium
        dbInstanceType:     db.t3.medium
        amiImageId:

    # ------------------------------------------------------------
    # K8 properties
    # ------------------------------------------------------------

    kubernetes:
        inUse:             true
        host:               # leave blank and terraform will assign
        hostTarget:        aws
        serviceType:       LoadBalancer # best option to start

    # ------------------------------------------------------------
    # System options influence the generative output and possible
    # features of the resulting system.  Understand the purpose
    # and intent of each.
    # ------------------------------------------------------------
    options:

        # ------------------------------------------------------------
        # Application parameters
        # ------------------------------------------------------------

        application:
            name:                  golangdemo
            description:           Demo Go project generated by Harbormaster
            author:                Dev Team
            email:                 xxxx.xxxxxxxxx@xxxxxxxx.com
            application logo URL:  ./img/turnstone.biologics.png
            company name:          Turnstone Biologics
            version:               0.0.1
            adminUserId:           admin	# use this and the adminPassword to access the application at the default URL
            adminPassword:         letmein2

        # ------------------------------------------------------------
        # CI/CD parameters
        # ------------------------------------------------------------

        cicd:
            platform: circle      # options - codeship, circleci, jfrog.pipelines, jenkins, azure, aws, gitlab, bitbucket, github

        # ------------------------------------------------------------
        # Go  properties
        # ------------------------------------------------------------

        go:
           appPort:        8088
           dbType:         mysql #options: mysql,postgres,sqlite,sqlserver
           dbUserName:     root
           dbPassword:     letmein2
           dbName:         appDB
           dbHost:         127.0.0.1
           dbPort:         3306
           dbArgs:         charset=utf8mb4&parseTime=True&loc=Local&createDatabaseIfNotExist=true&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true

            
    